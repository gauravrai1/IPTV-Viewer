name: AIO image build check

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "aio/**"
      - "Dockerfile.aio"
      - ".dockerignore"
      - ".github/workflows/docker-build-check.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "aio/**"
      - "Dockerfile.aio"
      - ".dockerignore"
      - ".github/workflows/docker-build-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AIO image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.aio
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
